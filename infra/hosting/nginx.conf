user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format peercalc '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
    access_log /dev/stdout peercalc;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name ${PEERCALC_DOMAIN};
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $identity_upstream http://identity:8080;
        set $login_upstream http://login:4180;
        absolute_redirect off;
        client_max_body_size 20m;
        proxy_read_timeout 90s;
        large_client_header_buffers 4 16k;

        location = /healthz {
            access_log off;
            proxy_pass $login_upstream/ping;
            proxy_pass_request_body off;
        }

        location ~* ^/auth/(admin|realms/master) {
            return 404;
        }

        location = /auth { return 308 /auth/; }
        location /auth/ {
            proxy_pass $identity_upstream;
            proxy_set_header Host ${PEERCALC_DOMAIN};
            proxy_set_header X-Forwarded-Host ${PEERCALC_DOMAIN};
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
        }

        location /oauth2/ {
            proxy_pass $login_upstream;
            proxy_set_header Host ${PEERCALC_DOMAIN};
            proxy_set_header X-Forwarded-Host ${PEERCALC_DOMAIN};
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Auth-Request-Redirect https://${PEERCALC_DOMAIN}$request_uri;
            proxy_buffer_size 16k;
            proxy_buffers 8 16k;
        }

        location = /oauth2/auth {
            internal;
            proxy_pass $login_upstream/oauth2/auth;
            proxy_set_header Host ${PEERCALC_DOMAIN};
            proxy_set_header X-Forwarded-Host ${PEERCALC_DOMAIN};
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 443;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header X-Original-URL https://${PEERCALC_DOMAIN}$request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Content-Length "";
            proxy_pass_request_body off;
        }

        location = /signin-with-chatgpt { return 302 /oauth2/start?rd=%2F; }
        location = /signout-with-chatgpt { return 302 /oauth2/sign_out?rd=%2F; }
        location @signin { return 302 /oauth2/start?rd=%2F; }
        location @unauthorized {
            default_type application/json;
            return 401 '{"error":"Sign in to access your workspace"}';
        }

        location /api/ {
            auth_request /oauth2/auth;
            error_page 401 = @unauthorized;
            include /etc/nginx/proxy-app.conf;
        }

        location / {
            auth_request /oauth2/auth;
            error_page 401 = @signin;
            include /etc/nginx/proxy-app.conf;
        }
    }
}

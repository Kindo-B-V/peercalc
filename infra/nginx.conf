log_format peercalc '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 8080;
    server_name localhost;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $identity_upstream http://identity:8080;
    set $login_upstream http://login:4180;
    absolute_redirect off;
    access_log /var/log/nginx/access.log peercalc;
    client_max_body_size 20m;
    proxy_read_timeout 90s;
    large_client_header_buffers 4 16k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /auth/ {
        proxy_pass $identity_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /oauth2/ {
        proxy_pass $login_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Auth-Request-Redirect $scheme://$http_host$request_uri;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass $login_upstream/oauth2/auth;
        proxy_set_header Host $http_host;
        proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body off;
    }

    location = /signin-with-chatgpt { return 302 /oauth2/start?rd=%2F; }
    location = /signout-with-chatgpt { return 302 /oauth2/sign_out?rd=%2F; }
    location @signin { return 302 /oauth2/start?rd=%2F; }
    location @unauthorized {
        default_type application/json;
        return 401 '{"error":"Sign in to access your workspace"}';
    }

    location /api/ {
        auth_request /oauth2/auth;
        error_page 401 = @unauthorized;
        include /etc/nginx/proxy-app.conf;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @signin;
        include /etc/nginx/proxy-app.conf;
    }
}

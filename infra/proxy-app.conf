auth_request_set $identity_user $upstream_http_x_auth_request_user;
auth_request_set $identity_email $upstream_http_x_auth_request_email;
auth_request_set $refreshed_cookie $upstream_http_set_cookie;
add_header Set-Cookie $refreshed_cookie always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy same-origin always;
add_header X-Frame-Options SAMEORIGIN always;
set $app_upstream http://web:8788;
proxy_pass $app_upstream;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header oai-authenticated-user-id $identity_user;
proxy_set_header oai-authenticated-user-email $identity_email;
proxy_set_header oai-authenticated-user-full-name "";
proxy_set_header oai-authenticated-user-full-name-encoding "";

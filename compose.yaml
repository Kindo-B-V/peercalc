name: peercalc

services:
  gateway:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:${PEERCALC_PORT:-8788}:8080"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/proxy-app.conf:/etc/nginx/proxy-app.conf:ro
    depends_on:
      web:
        condition: service_healthy
      identity:
        condition: service_healthy
      login:
        condition: service_started
    restart: unless-stopped

  web:
    build: ./web
    environment:
      CALC_CONVERTER_URL: http://converter:8082
      CALC_CONVERTER_TOKEN: ${CALC_CONVERTER_TOKEN:?Run node scripts/configure-local.mjs first}
    volumes:
      - documents:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 10
    depends_on:
      - converter
    restart: unless-stopped

  converter:
    build: ./converter
    environment:
      PORT: "8082"
      CALC_CONVERTER_TOKEN: ${CALC_CONVERTER_TOKEN:?Run local setup first}
    restart: unless-stopped

  identity:
    image: quay.io/keycloak/keycloak:26.4.2
    command: ["start-dev", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_HOSTNAME: http://localhost:${PEERCALC_PORT:-8788}/auth
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PEERCALC_ADMIN_PASSWORD:?Run local setup first}
      PEERCALC_ORIGIN: http://localhost:${PEERCALC_PORT:-8788}
      PEERCALC_CLIENT_SECRET: ${PEERCALC_CLIENT_SECRET:?Run local setup first}
      PEERCALC_OWNER_PASSWORD: ${PEERCALC_OWNER_PASSWORD:?Run local setup first}
    volumes:
      - identity:/opt/keycloak/data
      - ./infra/peercalc-realm.json:/opt/keycloak/data/import/peercalc-realm.json:ro
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/8080; printf 'GET /auth/realms/peercalc HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ \"$$line\" == *\"200\"* ]]"]
      interval: 5s
      timeout: 3s
      start_period: 40s
      retries: 20
    restart: unless-stopped

  login:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${PEERCALC_CLIENT_SECRET:?Run local setup first}
      OAUTH2_PROXY_COOKIE_SECRET: ${PEERCALC_COOKIE_SECRET:?Run local setup first}
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --client-id=peercalc
      - --redirect-url=http://localhost:${PEERCALC_PORT:-8788}/oauth2/callback
      - --oidc-issuer-url=http://localhost:${PEERCALC_PORT:-8788}/auth/realms/peercalc
      - --skip-oidc-discovery=true
      - --login-url=http://localhost:${PEERCALC_PORT:-8788}/auth/realms/peercalc/protocol/openid-connect/auth
      - --redeem-url=http://identity:8080/auth/realms/peercalc/protocol/openid-connect/token
      - --profile-url=http://identity:8080/auth/realms/peercalc/protocol/openid-connect/userinfo
      - --oidc-jwks-url=http://identity:8080/auth/realms/peercalc/protocol/openid-connect/certs
      - --backend-logout-url=http://identity:8080/auth/realms/peercalc/protocol/openid-connect/logout?id_token_hint={id_token}
      - --email-domain=*
      # Local accounts use email for display only; authorization uses the OIDC subject.
      - --insecure-oidc-allow-unverified-email=true
      - --scope=openid email profile
      - --code-challenge-method=S256
      - --insecure-oidc-skip-nonce=false
      - --upstream=static://202
      - --set-xauthrequest=true
      - --reverse-proxy=true
      - --skip-provider-button=true
      - --cookie-name=peercalc_session
      - --cookie-secure=false
      - --cookie-samesite=lax
      - --cookie-refresh=4m
      - --cookie-expire=8h
      - --request-logging=false
      - --session-store-type=redis
      - --redis-connection-url=redis://sessions:6379
    depends_on:
      - identity
      - sessions
    restart: unless-stopped

  sessions:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sessions:/data
    restart: unless-stopped

volumes:
  documents:
  identity:
  sessions:

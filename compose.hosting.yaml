name: peercalc-hosting

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  edge:
    <<: *service-defaults
    image: caddy:2.11.7-alpine
    environment:
      PEERCALC_DOMAIN: ${PEERCALC_DOMAIN:?Run scripts/host-rhel9.sh first}
      ACME_EMAIL: ${ACME_EMAIL:?Run scripts/host-rhel9.sh first}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/hosting/Caddyfile:/etc/caddy/Caddyfile:ro,Z
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    depends_on:
      gateway:
        condition: service_healthy

  gateway:
    <<: *service-defaults
    image: nginx:1.28-alpine
    environment:
      PEERCALC_DOMAIN: ${PEERCALC_DOMAIN:?Run scripts/host-rhel9.sh first}
      NGINX_ENVSUBST_FILTER: "^PEERCALC_DOMAIN$$"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
    volumes:
      - ./infra/hosting/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro,Z
      - ./infra/hosting/proxy-app.conf:/etc/nginx/templates/proxy-app.conf.template:ro,Z
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 10
    depends_on:
      web:
        condition: service_healthy
      identity:
        condition: service_healthy
      login:
        condition: service_started

  web:
    <<: *service-defaults
    build: ./web
    environment:
      CALC_CONVERTER_URL: http://converter:8082
      CALC_CONVERTER_TOKEN: ${CALC_CONVERTER_TOKEN:?Run scripts/host-rhel9.sh first}
    volumes:
      - documents:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/api/me').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 10
    depends_on:
      - converter

  converter:
    <<: *service-defaults
    build: ./converter
    environment:
      PORT: "8082"
      CALC_CONVERTER_TOKEN: ${CALC_CONVERTER_TOKEN:?Run scripts/host-rhel9.sh first}

  identity-db:
    <<: *service-defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${PEERCALC_DB_PASSWORD:?Run scripts/host-rhel9.sh first}
    volumes:
      - identity_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 20

  identity:
    <<: *service-defaults
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm", "--http-relative-path=/auth"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://identity-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${PEERCALC_DB_PASSWORD:?Run scripts/host-rhel9.sh first}
      KC_HOSTNAME: https://${PEERCALC_DOMAIN:?Run scripts/host-rhel9.sh first}/auth
      KC_HOSTNAME_STRICT: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${PEERCALC_ADMIN_PASSWORD:?Run scripts/host-rhel9.sh first}
      PEERCALC_ORIGIN: https://${PEERCALC_DOMAIN:?Run scripts/host-rhel9.sh first}
      PEERCALC_CLIENT_SECRET: ${PEERCALC_CLIENT_SECRET:?Run scripts/host-rhel9.sh first}
      PEERCALC_OWNER_PASSWORD: ${PEERCALC_OWNER_PASSWORD:?Run scripts/host-rhel9.sh first}
    volumes:
      - ./.hosting/peercalc-realm.json:/opt/keycloak/data/import/peercalc-realm.json:ro,Z
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3; read -r line <&3; [[ \"$$line\" == *\"200\"* ]]"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 30
    depends_on:
      identity-db:
        condition: service_healthy

  login:
    <<: *service-defaults
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    environment:
      OAUTH2_PROXY_CLIENT_SECRET: ${PEERCALC_CLIENT_SECRET:?Run scripts/host-rhel9.sh first}
      OAUTH2_PROXY_COOKIE_SECRET: ${PEERCALC_COOKIE_SECRET:?Run scripts/host-rhel9.sh first}
    command:
      - --http-address=0.0.0.0:4180
      - --provider=keycloak-oidc
      - --client-id=peercalc
      - --redirect-url=https://${PEERCALC_DOMAIN:?Run scripts/host-rhel9.sh first}/oauth2/callback
      - --oidc-issuer-url=https://${PEERCALC_DOMAIN:?Run scripts/host-rhel9.sh first}/auth/realms/peercalc
      - --skip-oidc-discovery=true
      - --login-url=https://${PEERCALC_DOMAIN:?Run scripts/host-rhel9.sh first}/auth/realms/peercalc/protocol/openid-connect/auth
      - --redeem-url=http://identity:8080/auth/realms/peercalc/protocol/openid-connect/token
      - --profile-url=http://identity:8080/auth/realms/peercalc/protocol/openid-connect/userinfo
      - --oidc-jwks-url=http://identity:8080/auth/realms/peercalc/protocol/openid-connect/certs
      - --backend-logout-url=http://identity:8080/auth/realms/peercalc/protocol/openid-connect/logout?id_token_hint={id_token}
      - --email-domain=*
      - --insecure-oidc-allow-unverified-email=false
      - --scope=openid email profile
      - --code-challenge-method=S256
      - --insecure-oidc-skip-nonce=false
      - --upstream=static://202
      - --set-xauthrequest=true
      - --reverse-proxy=true
      - --skip-provider-button=true
      - --cookie-name=__Host-peercalc_session
      - --cookie-secure=true
      - --cookie-path=/
      - --cookie-samesite=lax
      - --cookie-refresh=4m
      - --cookie-expire=8h
      - --request-logging=false
      - --session-store-type=redis
      - --redis-connection-url=redis://sessions:6379
    depends_on:
      identity:
        condition: service_healthy
      sessions:
        condition: service_healthy

  sessions:
    <<: *service-defaults
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - sessions:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  documents:
  identity_database:
  sessions:
  caddy_data:
  caddy_config:
